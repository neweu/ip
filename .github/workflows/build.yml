name: Build Native Binary

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile x64 Native Executable
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          mkdir dist
          cl /O2 /EHsc /utf-8 /W4 ip.cpp /Fe:dist\ip.exe /link /SUBSYSTEM:WINDOWS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ip
          path: dist/ip.exe

      - name: Attach Executable to Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: |
          gh release upload ${{ github.ref_name }} dist\ip.exe --clobber || gh release create ${{ github.ref_name }} dist\ip.exe --generate-notes
